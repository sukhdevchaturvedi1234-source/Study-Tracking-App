name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q studytrack.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build web app
        working-directory: studytrack
        run: |
          npm install
          npm run build
      - name: Add Android and sync
        working-directory: studytrack
        run: |
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: studytrack/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: StudyTrack APK ${{ github.run_number }}
          files: studytrack/android/app/build/outputs/apk/debug/app-debug.apk
